# Runs the whole pipeline every 3 hours. Tide gauges post every 6 minutes and Coral
# Reef Watch once a day, so 3 hours keeps the page current without hammering NOAA.
#
# The Parquet lake (all history, ~7 MB) is NOT stored in git. It lives as a single
# file attached to a GitHub release called "lake": downloaded at the start, uploaded
# again at the end. If it is ever lost, the collectors see an empty lake and rebuild
# the full history from the agencies (a "backfill") - the pipeline heals itself.
name: Ocean conditions refresh

on:
  schedule:
    - cron: "17 */3 * * *"   # 00:17, 03:17, ... UTC (8:17 PM, 11:17 PM, ... in St. Croix)
  workflow_dispatch:
    inputs:
      test_failure:
        description: "Fail on purpose to test the failure alert"
        type: boolean
        default: false
      chained:
        description: "Started by the previous run (the backup for GitHub's scheduler)"
        type: boolean
        default: false

permissions:
  contents: write   # upload the lake to the release, daily data commit
  issues: write     # alert issues
  actions: write    # start the next run when GitHub's scheduler is not firing


jobs:
  refresh:
    runs-on: ubuntu-latest
    concurrency:      # never let two runs write the lake at the same time
      group: refresh
      cancel-in-progress: false
    timeout-minutes: 40
    env:
      FTP_SERVER: ${{ secrets.FTP_SERVER }}   # empty until the secret exists
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Download the lake from the "lake" release
        run: |
          if gh release download lake --pattern lake.tar.gz --dir /tmp 2>/dev/null; then
            tar -xzf /tmp/lake.tar.gz
            echo "Restored lake: $(du -sh lake | cut -f1)"
          else
            echo "::warning::No lake release found - this run will backfill the full history."
          fi

      - name: Run pipeline (collect, load, dbt build, export, alerts)
        env:
          TEST_FAILURE: ${{ inputs.test_failure }}
          ALERT_ASSIGNEE: ${{ vars.ALERT_ASSIGNEE }}
        run: python run_pipeline.py

      - name: Upload the lake back to the release
        run: |
          tar -czf /tmp/lake.tar.gz lake
          gh release view lake >/dev/null 2>&1 || \
            gh release create lake --title "Data lake (auto-updated)" \
              --notes "Parquet lake used by the refresh workflow. Replaced every run; do not delete unless you want a full backfill."
          gh release upload lake /tmp/lake.tar.gz --clobber

      # GitHub pauses scheduled workflows in repositories with no commits for 60 days.
      # One small commit a day (the first automatic run of the day, or any manual run) prevents that.
      - name: Daily data commit
        run: |
          # scheduled and chained runs commit only once a day; manual runs always do
          git fetch -q --deepen=200 || true   # the checkout has only the latest commit
          if [ "${{ github.event_name == 'schedule' || inputs.chained == true }}" = "true" ] && \
             [ "$(git log -1 --author=cdw-bot --format=%cd --date=format:%F)" = "$(date -u +%F)" ]; then exit 0; fi
          git config user.name "cdw-bot"
          git config user.email "hello@cruciandataworks.com"
          git add dashboard/data/summary.json
          git diff --cached --quiet || git commit -m "Daily ocean conditions snapshot"
          git push

      # Publish the refreshed dashboard to cruciandataworks.com (Hostinger) over FTP.
      # Skipped until the FTP secrets are added in Settings > Secrets and variables > Actions.
      - name: Upload dashboard to Hostinger
        if: ${{ env.FTP_SERVER != '' }}
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          local-dir: ./dashboard/
          server-dir: ${{ vars.FTP_SERVER_DIR || '/public_html/projects/ocean-conditions/' }}

      # If any step fails, open (or update) one "refresh failed" issue assigned to the
      # repository admin. Data alerts (bleaching, flooding, stale feeds) are separate
      # issues opened by step 7 of the pipeline.
      - name: Alert on failure
        if: ${{ failure() }}
        env:
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          ASSIGNEE: ${{ vars.ALERT_ASSIGNEE || 'OrlandoSpears' }}
        run: |
          gh label create refresh-failure --color C8553D --description "Scheduled refresh failed" 2>/dev/null || true
          body="The ocean conditions refresh failed on $(date -u '+%Y-%m-%d %H:%M UTC').

          Run log: $RUN_URL

          The website still shows the last good data. Close this issue once the cause is fixed."
          open=$(gh issue list --label refresh-failure --state open --json number -q '.[0].number')
          if [ -n "$open" ]; then
            gh issue comment "$open" --body "$body"
          else
            gh issue create --title "Ocean conditions refresh failed" --label refresh-failure --assignee "$ASSIGNEE" --body "$body"
          fi

      # Once a run succeeds, the cause of any earlier failure is gone, so close the open
      # "refresh failed" issue with a link to the run that worked.
      - name: Close the failure issue after a successful run
        if: ${{ success() }}
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          for n in $(gh issue list --label refresh-failure --state open --json number -q '.[].number'); do
            gh issue close "$n" --reason completed \
              --comment "Closed automatically: the refresh succeeded on $(date -u '+%Y-%m-%d %H:%M UTC'). Run log: $RUN_URL"
          done

  # Backup for GitHub's scheduler, which can take a long time to start firing in a new
  # repository and sometimes drops runs. This small job waits until 3 hours after the
  # refresh began, then starts the next run, unless any newer run of this workflow has
  # started in the meantime (a scheduled run, a manual run or another chain). Every run,
  # scheduled ones included, gets this job, so whichever run is newest carries the chain
  # on and there is only ever one chain. A late scheduled run no longer ends it. Newer
  # runs that were cancelled are ignored, because they never carry it on.
  # It runs in its own job so the wait never blocks other runs. Waiting uses free runner
  # time in a public repository. Set the repository variable CHAIN_RUNS to "false" to
  # turn this off.
  next-run:
    needs: refresh
    if: ${{ !cancelled() && vars.CHAIN_RUNS != 'false' }}
    runs-on: ubuntu-latest
    timeout-minutes: 210
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - name: Wait, then start the next run if nothing newer has started
        run: |
          started=$(gh run view ${{ github.run_id }} --json createdAt -q .createdAt)
          wait=$(( $(date -u -d "$started" +%s) + 10800 - $(date -u +%s) ))
          if [ "$wait" -gt 0 ]; then echo "Waiting ${wait}s"; sleep "$wait"; fi
          newer=$(gh run list --workflow refresh.yml --created ">$started" --limit 50 --json databaseId,conclusion \
                  -q '[.[] | select(.databaseId != ${{ github.run_id }} and .conclusion != "cancelled")] | length')
          if [ "$newer" != "0" ]; then echo "A newer run has started; it carries on from here."; exit 0; fi
          for attempt in 1 2 3; do
            if gh workflow run refresh.yml --ref ${{ github.ref_name }} -f chained=true; then echo "Started the next run."; exit 0; fi
            echo "::warning::Could not start the next run (attempt $attempt of 3); retrying in 30 seconds."
            sleep 30
          done
          echo "::error::Could not start the next run. The schedule and the external trigger will carry on."
          exit 1
