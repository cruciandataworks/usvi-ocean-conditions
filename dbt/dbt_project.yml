name: usvi_ocean
version: "1.0.0"
config-version: 2
profile: usvi_ocean

model-paths: ["models"]
seed-paths: ["seeds"]
test-paths: ["tests"]
macro-paths: ["macros"]

models:
  usvi_ocean:
    staging:
      +materialized: view
      +schema: staging
    intermediate:
      +materialized: view
      +schema: intermediate
    marts:
      +materialized: table
      +schema: marts

seeds:
  usvi_ocean:
    +schema: reference

vars:
  # NOAA's national rule for a minor ("nuisance") high-tide flood threshold where no
  # local one is published: 0.04 x the great diurnal tide range + 0.50 m above MHHW
  # (Sweet et al., 2018, NOAA Technical Report NOS CO-OPS 086).
  htf_range_factor: 0.04
  htf_offset_m: 0.50
  # how many collector runs in a row may fail before we raise an alert (runs are 3 hours apart)
  max_consecutive_failures: 4
